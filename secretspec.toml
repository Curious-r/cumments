[project]
name = "cumments"
revision = "1.0"

# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

# The default profile only declares that a secret exists; the actual value is
# provided by the user (e.g. a real database URL stored in the keyring), so it
# never has to be committed to the repository.
[profiles.default]
DATABASE_URL = { description = "Database connection string used by sqlx-cli during development (e.g. `sqlx database create`). The application reads its own URL from cumments.toml", required = false }

[profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
#
# For quick local runs we skip the secret backend and use a plain default value;
# this URL is not sensitive, so it is fine to have it here.
DATABASE_URL = { default = "sqlite://data/cumments.db" }
#
# New secrets
# REDIS_URL = { description = "Redis connection URL for caching", required = false, default = "redis://localhost:6379" }
