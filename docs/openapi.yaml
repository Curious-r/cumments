openapi: 3.0.3
info:
  title: Cumments API
  version: 0.20.2
  description: |
    Backend-only comment API backed by Matrix. Writes are asynchronous:
    POST/PATCH/DELETE accept an intent and return `202 { "intent_id" }`;
    the projected comment later carries the same `intent_id`.

    Comment reads use the RFC 10008 `QUERY` method. OpenAPI does not support
    custom verbs, so each QUERY operation is represented with the
    `x-cumments-query` extension and is sent as `QUERY` on the wire.
servers:
  - url: http://localhost:7931
tags:
  - name: Comments
    description: Comment reads, writes, and live events
  - name: Sites
    description: Site registration and origin verification
  - name: Admin
    description: Operator-only management endpoints
  - name: Meta
    description: Infrastructure endpoints
security: []
paths:
  /health:
    get:
      tags: [Meta]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/challenge:
    get:
      tags: [Comments]
      summary: Get a proof-of-work challenge
      operationId: getChallenge
      responses:
        "200":
          description: Challenge ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/posts/{post_slug}/comments:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PostSlug"
    post:
      tags: [Comments]
      summary: Submit a comment
      operationId: postComment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCommentRequest"
      responses:
        "202":
          description: "Intent accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Comments]
      summary: Edit a comment (body carries comment_id)
      operationId: updateCommentBody
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
      responses:
        "202":
          description: "Edit intent accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Comments]
      summary: Delete a comment (body carries comment_id)
      operationId: deleteCommentBody
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCommentRequest"
      responses:
        "202":
          description: "Delete intent accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    x-cumments-query:
      operationId: queryComments
      summary: List comments (QUERY)
      description: |
        Sent as `QUERY /api/v1/sites/{site_id}/posts/{post_slug}/comments`
        with a JSON body. This custom verb is represented here as an OpenAPI
        extension because OpenAPI only supports standard HTTP methods.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/PostSlug"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  default: 1
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
      responses:
        "200":
          description: Paginated comments
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/posts/{post_slug}/comments/{comment_id}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PostSlug"
      - $ref: "#/components/parameters/CommentId"
    patch:
      tags: [Comments]
      summary: Edit a comment (legacy path form)
      operationId: updateCommentPath
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
      responses:
        "202":
          description: "Edit intent accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Comments]
      summary: Delete a comment (legacy path form)
      operationId: deleteCommentPath
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCommentRequest"
      responses:
        "202":
          description: "Delete intent accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/posts/{post_slug}/sse:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PostSlug"
    get:
      tags: [Comments]
      summary: Live comment events (SSE)
      operationId: commentSse
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/sites:
    post:
      tags: [Sites]
      summary: Register a site
      operationId: registerSite
      responses:
        "201":
          description: Site registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterSiteResponse"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/verifications:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Sites]
      summary: Start origin verification
      operationId: startVerification
      parameters:
        - $ref: "#/components/parameters/ClaimToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartVerificationRequest"
      responses:
        "200":
          description: Verification challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationChallengeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/verifications/confirm:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Sites]
      summary: Confirm origin verification
      operationId: confirmVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmVerificationRequest"
      responses:
        "200":
          description: Origin verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmVerificationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/secret:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Sites]
      summary: Issue or rotate an HMAC site secret
      operationId: issueSecret
      parameters:
        - $ref: "#/components/parameters/ClaimToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueSecretRequest"
      responses:
        "200":
          description: Secret issued once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueSecretResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/admin/sites:
    x-cumments-query:
      tags: [Admin]
      summary: List managed sites (QUERY)
      operationId: listAdminSites
      description: |
        Sent as `QUERY /api/v1/admin/sites` with an optional JSON body
        carrying pagination and the `site_id` filter.
      security:
        - adminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminListQuery"
      responses:
        "200":
          description: Paginated sites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSitePage"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/sites/{site_id}/origins/revoke:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Admin]
      summary: Revoke a verified origin
      operationId: revokeVerifiedOrigin
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeOriginRequest"
      responses:
        "200":
          description: Site updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSite"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/admin/sites/{site_id}/secret/rotate:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Admin]
      summary: Rotate HMAC secret
      operationId: rotateSecret
      security:
        - adminToken: []
      responses:
        "200":
          description: New secret issued once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateSecretResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/admin/sites/{site_id}/secret:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    delete:
      tags: [Admin]
      summary: Revoke HMAC secret
      operationId: revokeSecret
      security:
        - adminToken: []
      responses:
        "200":
          description: Secret revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeSecretResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/sites/{site_id}/config-snippet:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [Admin]
      summary: Export config snippet
      operationId: configSnippet
      security:
        - adminToken: []
      responses:
        "200":
          description: TOML config snippet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSnippetResponse"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/admin/sites/{site_id}/claim-token/rotate:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Admin]
      summary: Rotate claim token
      operationId: rotateClaimToken
      security:
        - adminToken: []
      responses:
        "200":
          description: New claim token issued once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateClaimTokenResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/rooms/quarantined:
    x-cumments-query:
      tags: [Admin]
      summary: List quarantined rooms (QUERY)
      operationId: listQuarantinedRooms
      description: |
        Sent as `QUERY /api/v1/admin/rooms/quarantined` with an optional JSON
        body carrying pagination and the `site_id` filter.
      security:
        - adminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminListQuery"
      responses:
        "200":
          description: Paginated quarantined rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuarantinedRoomPage"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/rooms/quarantined/{room_id}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    delete:
      tags: [Admin]
      summary: Reinstate a room
      operationId: reinstateQuarantinedRoom
      security:
        - adminToken: []
      responses:
        "204":
          description: Room reinstated (idempotent)
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/admin/rooms/blocked:
    x-cumments-query:
      tags: [Admin]
      summary: List quarantined rooms (QUERY, deprecated alias)
      operationId: listBlockedRooms
      deprecated: true
      description: |
        Deprecated alias for `/api/v1/admin/rooms/quarantined`, kept for one
        release.
      security:
        - adminToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminListQuery"
      responses:
        "200":
          description: Paginated quarantined rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuarantinedRoomPage"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/rooms/blocked/{room_id}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    delete:
      tags: [Admin]
      summary: Reinstate a room (deprecated alias)
      operationId: unblockBlockedRoom
      deprecated: true
      security:
        - adminToken: []
      responses:
        "204":
          description: Room reinstated (idempotent)
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/media/{server}/{media_id}:
    parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
      - name: media_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Public]
      summary: Proxy a Matrix media file (signed URL)
      operationId: proxyMedia
      description: |
        Public read-only proxy for MXC media. URLs are HMAC-signed with a
        short TTL; requests are rate limited, restricted to the configured
        homeserver and filtered by size/content type.
      parameters:
        - name: expires
          in: query
          required: true
          schema:
            type: integer
        - name: sig
          in: query
          required: true
          schema:
            type: string
        - name: thumbnail
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Media bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/posts/{post_slug}/room:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PostSlug"
    get:
      tags: [Public]
      summary: Comment room metadata and system messages
      operationId: getRoomInfo
      responses:
        "200":
          description: Room info
          content:
            application/json:
              schema:
                type: object
                required: [room_id, member_count, system_messages]
                properties:
                  room_id:
                    type: string
                  name:
                    type: string
                    nullable: true
                  topic:
                    type: string
                    nullable: true
                  avatar_url:
                    type: string
                    nullable: true
                  member_count:
                    type: integer
                  system_messages:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id:
                          type: string
                        event_type:
                          type: string
                        state_key:
                          type: string
                        sender:
                          type: string
                        origin_server_ts:
                          type: integer
                        content_json:
                          type: object
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/posts/{post_slug}/media:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PostSlug"
    post:
      tags: [Comments]
      summary: Upload guest media (image/video/audio/file, voice)
      operationId: uploadMedia
      description: |
        Uploads raw bytes as the guest's virtual user. Query parameters carry
        the PoW challenge response and an Ed25519 signature over
        `UPLOAD/site/post/mime/filename/size/challenge`.
      parameters:
        - name: mime
          in: query
          required: true
          schema:
            type: string
        - name: filename
          in: query
          required: false
          schema:
            type: string
        - name: author_public_key
          in: query
          required: true
          schema:
            type: string
        - name: author_signature
          in: query
          required: true
          schema:
            type: string
        - name: challenge_response
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Uploaded media reference
          content:
            application/json:
              schema:
                type: object
                required: [url, filename, mimetype, size, voice]
                properties:
                  url:
                    type: string
                  filename:
                    type: string
                  mimetype:
                    type: string
                  size:
                    type: integer
                  voice:
                    type: boolean
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/posts/{post_slug}/stickers:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PostSlug"
    get:
      tags: [Public]
      summary: List preset stickers
      operationId: listStickers
      responses:
        "200":
          description: Preset stickers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [url, proxy_url, alt]
                  properties:
                    url:
                      type: string
                    proxy_url:
                      type: string
                    alt:
                      type: string
  /api/v1/sites/{site_id}/posts/{post_slug}/comments/{comment_id}/reactions:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PostSlug"
      - $ref: "#/components/parameters/CommentId"
    post:
      tags: [Comments]
      summary: React to a comment
      operationId: reactToComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, author_public_key, author_signature, challenge_response]
              properties:
                key:
                  type: string
                author_public_key:
                  type: string
                author_signature:
                  type: string
                challenge_response:
                  type: string
      responses:
        "204":
          description: Reaction sent
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/posts/{post_slug}/polls/{poll_id}/votes:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PostSlug"
      - name: poll_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Comments]
      summary: Vote on a poll
      operationId: votePoll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option_id, author_public_key, author_signature, challenge_response]
              properties:
                option_id:
                  type: string
                author_public_key:
                  type: string
                author_signature:
                  type: string
                challenge_response:
                  type: string
      responses:
        "204":
          description: Vote sent
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/posts/{post_slug}/location:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PostSlug"
    post:
      tags: [Comments]
      summary: Post a location message
      operationId: postLocation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - geo_uri
                - display_name
                - author_public_key
                - author_signature
                - challenge_response
              properties:
                geo_uri:
                  type: string
                description:
                  type: string
                  nullable: true
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 50
                author_public_key:
                  type: string
                author_signature:
                  type: string
                challenge_response:
                  type: string
      responses:
        "202":
          description: "Location intent accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
  parameters:
    SiteId:
      name: site_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,64}$"
    PostSlug:
      name: post_slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,64}$"
    CommentId:
      name: comment_id
      in: path
      required: true
      schema:
        type: string
        description: Matrix event ID, percent-encoded
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
        description: Matrix room ID, percent-encoded
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Mandatory for all write intents. 8-255 printable ASCII characters,
        scoped to the author's public key. Retrying an accepted request with
        the same key and body returns the original `intent_id` with
        `Idempotent-Replayed: true`; a different body with the same key
        returns `409 code=idempotency-key-reused`. Keys are retained
        for 24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: "^[!-~]{8,255}$"
    ClaimToken:
      name: X-Cumments-Claim-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    Error:
      description: RFC 9457 problem details response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Canonical URI of the problem type
        title:
          type: string
          description: Stable short human-readable name of the type
        status:
          type: integer
          format: int32
          description: HTTP status code, identical to the response status
        detail:
          type: string
          description: Occurrence-specific explanation for the client
        code:
          type: string
          description: Stable machine-readable slug; the fragment (after `#`) of `type`
        details:
          type: object
          nullable: true
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ChallengeResponse:
      type: object
      required: [prefix, difficulty]
      properties:
        prefix:
          type: string
        difficulty:
          type: integer
          minimum: 1
    IntentAccepted:
      type: object
      required: [intent_id]
      properties:
        intent_id:
          type: integer
          format: int64
    PaginationMeta:
      type: object
      required: [total, page, per_page, total_pages]
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
    CommentAuthor:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [guest, matrix]
        display_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        public_key:
          type: string
          nullable: true
        mxid:
          type: string
          nullable: true
    Message:
      type: object
      required:
        - event_id
        - site_id
        - post_slug
        - room_id
        - sender_mxid
        - author
        - content
        - timestamp
        - status
        - reactions
        - raw_content
      properties:
        event_id:
          type: string
        site_id:
          type: string
        post_slug:
          type: string
        room_id:
          type: string
        sender_mxid:
          type: string
        author:
          $ref: "#/components/schemas/CommentAuthor"
        content:
          $ref: "#/components/schemas/Content"
        timestamp:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
          description: Matrix `origin_server_ts` of the last applied edit
        reply_to:
          type: string
          nullable: true
        thread_root:
          type: string
          nullable: true
        intent_id:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [active, redacted]
        redacted_at:
          type: string
          format: date-time
          nullable: true
        redacted_by:
          type: string
          nullable: true
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionSummary"
        raw_content:
          type: object
          description: Raw Matrix event content (forward-compatibility escape hatch)
    Content:
      type: object
      description: |
        Typed displayable content. Fields are grouped by `type`; only the
        fields of the selected variant are present (plus `type` itself).
      required: [type]
      properties:
        type:
          type: string
          enum: [text, media, location, poll, encrypted, unknown]
        # text
        body:
          type: string
        formatted_body:
          type: string
          nullable: true
          description: HTML body; renderers MUST sanitize it
        style:
          type: string
          enum: [normal, emote, notice]
        # media
        kind:
          type: string
          enum: [image, video, audio, file, sticker]
        url:
          type: string
          description: MXC URI or signed media-proxy URL after proxying
        filename:
          type: string
          nullable: true
        mimetype:
          type: string
          nullable: true
        size:
          type: integer
          format: int64
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        thumbnail_url:
          type: string
          nullable: true
        alt_text:
          type: string
          nullable: true
        voice:
          type: boolean
          description: MSC3245 voice message marker (media only)
        # location
        geo_uri:
          type: string
        description:
          type: string
          nullable: true
        # poll
        question:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"
        responses:
          type: array
          items:
            $ref: "#/components/schemas/PollResponseSummary"
        # encrypted
        algorithm:
          type: string
        sender_key:
          type: string
          nullable: true
        # unknown
        fallback:
          type: string
          nullable: true
        raw:
          type: object
          description: Raw content of an unknown message type
    PollOption:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          description: Matrix answer ID used when voting
        text:
          type: string
    PollResponseSummary:
      type: object
      required: [option_index, count]
      properties:
        option_index:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
    ReactionSummary:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer
          format: int64
    PostCommentRequest:
      type: object
      required: [content, display_name, author_public_key, author_signature, challenge_response]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
        media:
          description: |
            Optional media attachment; when present the signature covers
            `media.url` instead of `content`.
          type: object
          required: [url]
          properties:
            kind:
              type: string
              enum: [image, video, audio, file, sticker]
              nullable: true
            url:
              type: string
              description: MXC URI returned by the media upload endpoint
            filename:
              type: string
              nullable: true
            mimetype:
              type: string
              nullable: true
            size:
              type: integer
              format: int64
              nullable: true
            width:
              type: integer
              nullable: true
            height:
              type: integer
              nullable: true
            voice:
              type: boolean
              default: false
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        author_public_key:
          type: string
        author_signature:
          type: string
        reply_to:
          type: string
          nullable: true
        challenge_response:
          type: string
    UpdateCommentRequest:
      type: object
      required: [content, author_public_key, author_signature, challenge_response]
      properties:
        comment_id:
          type: string
          description: Required for the collection endpoint; optional on the path endpoint
        content:
          type: string
          minLength: 1
          maxLength: 5000
        author_public_key:
          type: string
        author_signature:
          type: string
        challenge_response:
          type: string
    DeleteCommentRequest:
      type: object
      required: [author_public_key, author_signature, challenge_response]
      properties:
        comment_id:
          type: string
          description: Required for the collection endpoint; optional on the path endpoint
        author_public_key:
          type: string
        author_signature:
          type: string
        challenge_response:
          type: string
    RegisterSiteResponse:
      type: object
      required: [site_id, claim_token]
      properties:
        site_id:
          type: string
        claim_token:
          type: string
    StartVerificationRequest:
      type: object
      required: [origins, methods]
      properties:
        origins:
          type: array
          minItems: 1
          items:
            type: string
        methods:
          type: array
          minItems: 1
          items:
            type: string
            enum: [well-known, dns]
    VerificationChallengeResponse:
      type: object
      required: [site_id, token, methods, origins, expires_at, instructions]
      properties:
        site_id:
          type: string
        token:
          type: string
        methods:
          type: array
          items:
            type: string
        origins:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        instructions:
          type: object
    ConfirmVerificationRequest:
      type: object
      required: [origin, token]
      properties:
        origin:
          type: string
        token:
          type: string
    ConfirmVerificationResponse:
      type: object
      required: [site_id, origin, status, verified_origins]
      properties:
        site_id:
          type: string
        origin:
          type: string
        status:
          type: string
        verified_origins:
          type: array
          items:
            type: string
    IssueSecretRequest:
      type: object
      properties:
        rotate:
          type: boolean
          default: false
    IssueSecretResponse:
      type: object
      required: [site_id, secret]
      properties:
        site_id:
          type: string
        secret:
          type: string
    AdminOrigin:
      type: object
      required: [origin, source]
      properties:
        origin:
          type: string
        source:
          type: string
          enum: [config, verified]
    AdminSite:
      type: object
      required: [site_id, auth_mode, verification_status, origins]
      properties:
        site_id:
          type: string
        auth_mode:
          type: string
          enum: [origin, secret]
        verification_status:
          type: string
          enum: [unverified, verified]
        origins:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrigin"
        verified_at:
          type: string
          format: date-time
          nullable: true
        has_secret:
          type: boolean
        has_claim_token:
          type: boolean
        updated_at:
          type: string
          format: date-time
          nullable: true
    AdminSitePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminSite"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    AdminListQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        site_id:
          type: string
    AdminQuarantinedRoom:
      type: object
      required:
        - room_id
        - site_id
        - post_slug
        - quarantine_reason
        - quarantined_at
        - adoption_failures
      properties:
        room_id:
          type: string
        site_id:
          type: string
        post_slug:
          type: string
        quarantine_reason:
          type: string
        quarantined_at:
          type: string
          format: date-time
        adoption_failures:
          type: integer
          minimum: 1
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
    AdminQuarantinedRoomPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuarantinedRoom"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    RevokeOriginRequest:
      type: object
      required: [origin]
      properties:
        origin:
          type: string
    RotateSecretResponse:
      type: object
      required: [site_id, secret]
      properties:
        site_id:
          type: string
        secret:
          type: string
    RevokeSecretResponse:
      type: object
      required: [site_id, auth_mode]
      properties:
        site_id:
          type: string
        auth_mode:
          type: string
          enum: [origin, secret]
    RotateClaimTokenResponse:
      type: object
      required: [site_id, claim_token]
      properties:
        site_id:
          type: string
        claim_token:
          type: string
    ConfigSnippetResponse:
      type: object
      required: [site_id, toml]
      properties:
        site_id:
          type: string
        toml:
          type: string
