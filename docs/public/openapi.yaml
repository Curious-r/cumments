          required: false
          schema:
            type: string
        - name: author_public_key
          in: query
          required: true
          schema:
            type: string
        - name: author_signature
          in: query
          required: true
          schema:
            type: string
        - name: challenge_response
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Avatar set on the virtual user's profile
          headers:
