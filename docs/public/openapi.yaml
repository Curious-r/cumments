components:
  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
    claimToken:
      type: apiKey
      in: header
      name: X-Cumments-Claim-Token
  parameters:
    SiteId:
      name: site_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,64}$"
    PageSlug:
      name: page_slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]{1,64}$"
    CommentId:
      name: comment_id
      in: path
      required: true
      schema:
        type: string
        description: Matrix event ID, percent-encoded
    CommentIdQuery:
      name: comment_id
      in: query
      required: true
      schema:
        type: string
        description: Matrix event ID, percent-encoded
    UserIdQuery:
      name: user_id
      in: query
      required: true
      schema:
        type: string
        description: Fully qualified Matrix user ID, percent-encoded
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
        description: Matrix room ID, percent-encoded
    TargetEventId:
      name: target_event_id
      in: path
      required: true
      schema:
        type: string
      description: Matrix event ID of the failed fact, percent-encoded
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Mandatory for durable submission endpoints and visitor media/avatar
        uploads. 8-255 printable ASCII characters, scoped to the author's
        public key.
        Retrying an accepted request with the same key and body returns the
        original result (`submission_id` or media URL) with
        `Idempotent-Replayed: true`; a different body with the same key
        returns `409 code=idempotency-key-reused`. Keys are retained for
        24 hours.
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: "^[!-~]{8,255}$"
    ClaimToken:
      name: X-Cumments-Claim-Token
      in: header
      required: true
      schema:
        type: string
  responses:
    Error:
      description: RFC 9457 problem details response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: |
        Rate limit exceeded (RFC 9457 problem details). `Retry-After` is the
        endpoint's fixed limit window in seconds; it is a conservative
        constant, not the exact remaining time for this client key.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
            format: int64
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: Canonical URI of the problem type
        title:
          type: string
          description: Stable short human-readable name of the type
        status:
          type: integer
          format: int32
          description: HTTP status code, identical to the response status
        detail:
          type: string
          description: Occurrence-specific explanation for the client
        code:
          type: string
          description: Stable machine-readable slug; the fragment (after `#`) of `type`
        details:
          type: [object, "null"]
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    VisitorProfile:
      type: object
      required: [visitor_id, display_name, avatar_url]
      properties:
        visitor_id:
          type: string
          description: 32-hex identifier derived from the public key.
        display_name:
          type: [string, "null"]
          description: Current Matrix profile display name, or null when unset.
        avatar_url:
          type: [string, "null"]
          description: |
            Signed proxy URL (96×96 crop variant when the media proxy is
            enabled; the raw MXC URL otherwise), or null when unset.
    ChallengeResponse:
      type: object
      required: [prefix, difficulty]
      properties:
        prefix:
          type: string
        difficulty:
          type: integer
          minimum: 1
    SubmissionAccepted:
      type: object
      required: [submission_id]
      properties:
        submission_id:
          type: integer
          format: int64
    PaginationMeta:
      type: object
      required: [total, page, per_page, total_pages]
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
    CommentAuthor:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [visitor, matrix]
        display_name:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
        public_key:
          type: [string, "null"]
        mxid:
          type: [string, "null"]
    Message:
      type: object
      required:
        - event_id
        - site_id
        - page_slug
        - author
        - content
        - timestamp
        - status
        - reactions
      properties:
        event_id:
          type: string
        site_id:
          type: string
        page_slug:
          type: string
        author:
          $ref: "#/components/schemas/CommentAuthor"
        content:
          $ref: "#/components/schemas/Content"
        timestamp:
          type: string
          format: date-time
        edited_at:
          type: [string, "null"]
          format: date-time
          description: Matrix `origin_server_ts` of the last applied edit
        reply_to:
          type: [string, "null"]
        thread_root:
          type: [string, "null"]
        submission_id:
          type: [integer, "null"]
          format: int64
        status:
          type: string
          enum: [active, redacted]
        redacted_at:
          type: [string, "null"]
          format: date-time
        redacted_by:
          type: [string, "null"]
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionSummary"
    Content:
      type: object
      description: |
        Typed displayable content. Fields are grouped by `type`; only the
        fields of the selected variant are present (plus `type` itself).
      required: [type]
      properties:
        type:
          type: string
          enum: [text, media, location, poll, redacted, encrypted, unknown]
        # text
        body:
          type: string
        formatted_body:
          type: [string, "null"]
          description: HTML body; renderers MUST sanitize it
        style:
          type: string
          enum: [normal, emote, notice]
        # media
        kind:
          type: string
          enum: [image, video, audio, file, sticker]
        url:
          type: string
          description: MXC URI or signed media-proxy URL after proxying
        filename:
          type: [string, "null"]
        mimetype:
          type: [string, "null"]
        size:
          type: [integer, "null"]
          format: int64
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        thumbnail_url:
          type: [string, "null"]
        alt_text:
          type: [string, "null"]
        voice:
          type: boolean
          description: MSC3245 voice message marker (media only)
        # location
        geo_uri:
          type: string
        description:
          type: [string, "null"]
        # poll
        question:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"
        max_selections:
          type: integer
          minimum: 1
          maximum: 20
          default: 1
          description: MSC3381 declared selection limit
        responses:
          type: array
          items:
            $ref: "#/components/schemas/PollResponseSummary"
        # redacted tombstone; no original fields are retained
        # encrypted
        algorithm:
          type: string
        sender_key:
          type: [string, "null"]
        # unknown
        fallback:
          type: [string, "null"]
        raw:
          type: object
          description: Raw content of an unknown message type
    PollOption:
      type: object
      required: [id, text]
      properties:
        id:
          type: string
          description: Matrix answer ID used when voting
        text:
          type: string
    PollResponseSummary:
      type: object
      required: [option_index, count]
      properties:
        option_index:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
    ReactionSummary:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer
          format: int64
    PostCommentRequest:
      type: object
      required: [content, display_name, author_public_key, author_signature, challenge_response]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
        media:
          description: |
            Optional media attachment; when present the signature covers
            `media.url` instead of `content`.
          type: object
          required: [url]
          properties:
            kind:
              oneOf:
                - type: string
                  enum: [image, video, audio, file, sticker]
                - type: "null"
            url:
              type: string
              description: MXC URI returned by the media upload endpoint
            filename:
              type: [string, "null"]
            mimetype:
              type: [string, "null"]
            size:
              type: [integer, "null"]
              format: int64
            width:
              type: [integer, "null"]
            height:
              type: [integer, "null"]
            voice:
              type: boolean
              default: false
        display_name:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Display name written to the virtual user's Matrix profile.
            Presentation data; deliberately not covered by the author
            signature.
        author_public_key:
          type: string
        author_signature:
          type: string
        reply_to:
          type: [string, "null"]
          description: Reply parent event ID (m.in_reply_to). Part of the author signature JSON array as `reply_to` (null when absent).
        thread_root:
          type: [string, "null"]
          description: Thread root event ID (m.thread). Orthogonal to reply_to. Part of the author signature JSON array as `thread_root` (null when absent). Signature covers ["POST", site, page, content|media.url, reply_to, thread_root, challenge_prefix].
        challenge_response:
          type: string
          description: PoW challenge response `prefix|nonce`; the signed `challenge_prefix` is the part before `|`.
    UpdateCommentRequest:
      type: object
      required: [content, author_public_key, author_signature, challenge_response]
      properties:
        comment_id:
          type: string
          description: Required for the collection endpoint; optional on the path endpoint
        content:
          type: string
          minLength: 1
          maxLength: 5000
        author_public_key:
          type: string
        author_signature:
          type: string
        challenge_response:
          type: string
    DeleteCommentRequest:
      type: object
      required: [author_public_key, author_signature, challenge_response]
      properties:
        author_public_key:
          type: string
        author_signature:
          type: string
        challenge_response:
          type: string
    RegisterSiteRequest:
      type: object
      properties:
        site_id:
          type: string
          pattern: "^[a-z0-9-]{1,64}$"
          description: |
            Optional first-come site id used in Matrix aliases and the Space
            display name. Omitted (or an empty body) generates a random id.
    RegisterSiteResponse:
      type: object
      required: [site_id, claim_token]
      properties:
        site_id:
          type: string
        claim_token:
          type: string
    RetirementResponse:
      type: object
      required: [target_type, target_id, state]
      properties:
        target_type:
          type: string
          enum: [site, page, room]
        target_id:
          type: string
        state:
          type: string
          enum: [retiring, retired]
    ProjectionRepair:
      type: object
      required:
        - target_event_id
        - room_id
        - redaction_event_id
        - reason
        - status
        - attempts
        - next_retry_at
        - created_at
        - updated_at
      properties:
        target_event_id:
          type: string
        room_id:
          type: string
        redaction_event_id:
          type: string
        reason:
          type: string
        observed_room_version:
          type: [string, "null"]
        status:
          type: string
          enum: [pending, manual, resolved]
        attempts:
          type: integer
          minimum: 1
        last_error:
          type: [string, "null"]
        next_retry_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, "null"]
          format: date-time
    ProjectionRepairPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectionRepair"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    UpgradeRoomRequest:
      type: object
      required: [new_version]
      properties:
        new_version:
          type: string
          description: Target Matrix room version; must be newer than the room's current version.
    UpgradePageRoomResponse:
      type: object
      required: [site_id, page_slug, new_version, replacement_room]
      properties:
        site_id:
          type: string
        page_slug:
          type: string
        new_version:
          type: string
        replacement_room:
          type: string
    UpgradeRoomResponse:
      type: object
      required: [room_id, new_version, replacement_room]
      properties:
        room_id:
          type: string
        new_version:
          type: string
        replacement_room:
          type: string
    StartVerificationRequest:
      type: object
      required: [origins, methods]
      properties:
        origins:
          type: array
          minItems: 1
          items:
            type: string
        methods:
          type: array
          minItems: 1
          items:
            type: string
            enum: [well-known, dns]
    VerificationChallengeResponse:
      type: object
      required: [site_id, token, methods, origins, expires_at, instructions]
      properties:
        site_id:
          type: string
        token:
          type: string
        methods:
          type: array
          items:
            type: string
        origins:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        instructions:
          type: object
    ConfirmVerificationRequest:
      type: object
      required: [origin, token]
      properties:
        origin:
          type: string
        token:
          type: string
    ConfirmVerificationResponse:
      type: object
      required: [site_id, origin, status, verified_origins]
      properties:
        site_id:
          type: string
        origin:
          type: string
        status:
          type: string
        verified_origins:
          type: array
          items:
            type: string
    IssueSecretRequest:
      type: object
      properties:
        rotate:
          type: boolean
          default: false
    IssueSecretResponse:
      type: object
      required: [site_id, secret]
      properties:
        site_id:
          type: string
        secret:
          type: string
    OperatorOrigin:
      type: object
      required: [origin, source]
      properties:
        origin:
          type: string
        source:
          type: string
          enum: [config, verified]
    OperatorSite:
      type: object
      required: [site_id, lifecycle, auth_mode, verification_status, origins]
      properties:
        site_id:
          type: string
        lifecycle:
          type: string
          enum: [active, retiring, retired]
        auth_mode:
          type: string
          enum: [origin, secret]
        verification_status:
          type: string
          enum: [unverified, verified]
        origins:
          type: array
          items:
            $ref: "#/components/schemas/OperatorOrigin"
        verified_at:
          type: [string, "null"]
          format: date-time
        has_secret:
          type: boolean
        has_claim_token:
          type: boolean
        updated_at:
          type: [string, "null"]
          format: date-time
    OperatorSitePage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OperatorSite"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    OperatorListQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        site_id:
          type: string
    OperatorQuarantinedRoom:
      type: object
      required:
        - room_id
        - site_id
        - page_slug
        - quarantine_reason
        - quarantined_at
        - adoption_failures
      properties:
        room_id:
          type: string
        site_id:
          type: string
        page_slug:
          type: string
        quarantine_reason:
          type: string
        quarantined_at:
          type: string
          format: date-time
        adoption_failures:
          type: integer
          minimum: 1
        next_attempt_at:
          type: [string, "null"]
          format: date-time
    OperatorQuarantinedRoomPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OperatorQuarantinedRoom"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    UpgradeIntentListQuery:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        status:
          type: string
          enum: [requested, observed, adopted, failed, manual]
    OperatorRoomUpgradeIntent:
      type: object
      required:
        - old_room_id
        - expected_new_version
        - status
        - created_at
        - updated_at
      properties:
        old_room_id:
          type: string
        expected_new_version:
          type: string
        replacement_room_id:
          type: [string, "null"]
        status:
          type: string
          enum: [requested, observed, adopted, failed, manual]
        error_message:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OperatorRoomUpgradeIntentPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OperatorRoomUpgradeIntent"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    RoomUpgradeRecoveryRequest:
      type: object
      required: [new_version, replacement_room]
      properties:
        new_version:
          type: string
        replacement_room:
          type: string
    RoomUpgradeRecoveryResponse:
      type: object
      required: [room_id, new_version, replacement_room, status]
      properties:
        room_id:
          type: string
        new_version:
          type: string
        replacement_room:
          type: string
        status:
          type: string
          enum: [adopted]
    RevokeOriginRequest:
      type: object
      required: [origin]
      properties:
        origin:
          type: string
    RotateSecretResponse:
      type: object
      required: [site_id, secret]
      properties:
        site_id:
          type: string
        secret:
          type: string
    RevokeSecretResponse:
      type: object
      required: [site_id, auth_mode]
      properties:
        site_id:
          type: string
        auth_mode:
          type: string
          enum: [origin, secret]
    RotateClaimTokenResponse:
      type: object
      required: [site_id, claim_token]
      properties:
        site_id:
          type: string
        claim_token:
          type: string
    ConfigSnippetResponse:
      type: object
      required: [site_id, toml]
      properties:
        site_id:
          type: string
        toml:
          type: string
    UserIdRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          description: Fully qualified Matrix user ID.
    PendingRoleResponse:
      type: object
      required: [pending, user_id, level, verify_token, expires_at]
      properties:
        pending:
          type: boolean
          enum: [true]
        user_id:
          type: string
        level:
          type: integer
          enum: [100, 75, 50]
        verify_token:
          type: string
          description: One-time token; DM `cumments-claim:<token>` to the AppService bot.
        expires_at:
          type: string
          format: date-time
    RevokedRoleResponse:
      type: object
      required: [revoked, user_id, level]
      properties:
        revoked:
          type: boolean
          enum: [true]
        user_id:
          type: string
        level:
          type: integer
          enum: [100, 75, 50]
        warnings:
          type: array
          items:
            type: string
          description: Non-empty when the revocation leaves a notable state (e.g. the last site admin was removed).
    SiteRolesResponse:
      type: object
      required: [admins, managers]
      properties:
        admins:
          type: array
          items:
            type: string
        managers:
          type: array
          items:
            type: string
    PageRolesResponse:
      type: object
      required: [site_id, page_slug, room_id, admins, managers, moderators]
      properties:
        site_id:
          type: string
        page_slug:
          type: string
        room_id:
          type: string
        admins:
          type: array
          items:
            type: string
        managers:
          type: array
          items:
            type: string
        moderators:
          type: array
          items:
            type: string
    OwnerTransferInfo:
      type: object
      required: [site_id, target_mxid, status, expires_at]
      properties:
        site_id:
          type: string
        target_mxid:
          type: string
        status:
          type: string
          enum: [pending, completed, expired, cancelled]
        expires_at:
          type: string
          format: date-time
    OwnerTransferResponse:
      type: object
      required: [pending, user_id, level, verify_token, expires_at, transfer]
      properties:
        pending:
          type: boolean
          enum: [true]
        user_id:
          type: string
        level:
          type: integer
          enum: [100]
        verify_token:
          type: string
        expires_at:
          type: string
          format: date-time
        transfer:
          $ref: "#/components/schemas/OwnerTransferInfo"
    RoomModeratorsResponse:
      type: object
      required: [room_id, moderators]
      properties:
        room_id:
          type: string
        moderators:
          type: array
          items:
            type: string
    StickerPack:
      type: object
      required: [pack_id, images]
      properties:
        pack_id:
          type: string
          description: Matrix `m.room.image_pack` state key.
        display_name:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
        avatar_proxy_url:
          type: [string, "null"]
          description: Signed preview URL for the pack avatar (96×96 crop variant).
        images:
          type: array
          items:
            type: object
            required: [shortcode, url, proxy_url]
            properties:
              shortcode:
                type: string
              url:
                type: string
                description: MXC URL referenced when posting a sticker comment.
              proxy_url:
                type: string
                description: Signed preview URL served by the media proxy.
              body:
                type: [string, "null"]
              info:
                type: [object, "null"]
                description: Matrix ImageInfo (`w`/`h`, `mimetype`, `size`, ...).
    CommentSseFrame:
      type: object
      description: |
        One parsed Server-Sent Events frame. `event` routes the frame in the
        browser; `data` contains JSON whose schema depends on `event`.
      required: [event, data]
      properties:
        event:
          type: string
          enum:
            - message_created
            - message_updated
            - message_annotations_changed
            - message_deleted
            - ephemeral
        data:
          type: string
          contentMediaType: application/json
          contentSchema:
            oneOf:
              - $ref: "#/components/schemas/ProjectorEvent"
              - $ref: "#/components/schemas/EphemeralEvent"
        id:
          type: string
        retry:
          type: integer
          minimum: 0
    ProjectorEvent:
      type: object
      description: Projection update for a registered page.
      required: [type, payload]
      properties:
        type:
          type: string
        payload:
          type: object
      oneOf:
        - $ref: "#/components/schemas/MessageCreatedEvent"
        - $ref: "#/components/schemas/MessageUpdatedEvent"
        - $ref: "#/components/schemas/MessageAnnotationsChangedEvent"
        - $ref: "#/components/schemas/MessageDeletedEvent"
      discriminator:
        propertyName: type
        mapping:
          message_created: "#/components/schemas/MessageCreatedEvent"
          message_updated: "#/components/schemas/MessageUpdatedEvent"
          message_annotations_changed: "#/components/schemas/MessageAnnotationsChangedEvent"
          message_deleted: "#/components/schemas/MessageDeletedEvent"
    MessageCreatedEvent:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [message_created]
        payload:
          $ref: "#/components/schemas/PageMessagePayload"
    MessageUpdatedEvent:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [message_updated]
        payload:
          $ref: "#/components/schemas/PageMessagePayload"
    MessageAnnotationsChangedEvent:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [message_annotations_changed]
        payload:
          $ref: "#/components/schemas/PageMessagePayload"
    PageMessagePayload:
      type: object
      required: [site_id, page_slug, message]
      properties:
        site_id:
          type: string
        page_slug:
          type: string
        message:
          $ref: "#/components/schemas/Message"
    MessageDeletedEvent:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          enum: [message_deleted]
        payload:
          type: object
          required: [site_id, page_slug, event_id]
          properties:
            site_id:
              type: string
            page_slug:
              type: string
            event_id:
              type: string
            submission_id:
              type: integer
              format: int64
    EphemeralEvent:
      type: object
      description: Live typing, read receipt or presence update.
      required: [type]
      properties:
        type:
          type: string
      oneOf:
        - $ref: "#/components/schemas/EphemeralTypingEvent"
        - $ref: "#/components/schemas/EphemeralReadReceiptEvent"
        - $ref: "#/components/schemas/EphemeralPresenceEvent"
      discriminator:
        propertyName: type
        mapping:
          typing: "#/components/schemas/EphemeralTypingEvent"
          receipt: "#/components/schemas/EphemeralReadReceiptEvent"
          presence: "#/components/schemas/EphemeralPresenceEvent"
    EphemeralTypingEvent:
      type: object
      required: [type, room_id, user_id, typing]
      properties:
        type:
          type: string
          enum: [typing]
        room_id:
          type: string
        user_id:
          type: string
        typing:
          type: boolean
        display_name:
          type: [string, "null"]
    EphemeralReadReceiptEvent:
      type: object
      required: [type, room_id, event_id, user_id]
      properties:
        type:
          type: string
          enum: [receipt]
        room_id:
          type: string
        event_id:
          type: string
        user_id:
          type: string
    EphemeralPresenceEvent:
      type: object
      required: [type, user_id, presence]
      properties:
        type:
          type: string
          enum: [presence]
        user_id:
          type: string
        presence:
          type: string
          description: Homeserver presence value, commonly `online` or `offline`.
  requestBodies:
    AddSticker:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [shortcode, url]
            properties:
              shortcode:
                type: string
              url:
                type: string
              body:
                type: string
              info:
                type: object
