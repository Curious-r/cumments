  /api/v1/sites/{site_id}/pages/{page_slug}/location:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageSlug"
    post:
      tags: [Comments]
      summary: Post a location message
      operationId: postLocation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: Author signature covers ["LOCATE", site, page, geo_uri, reply_to, thread_root, challenge_prefix] (reply_to/thread_root null when absent).
        content:
          application/json:
            schema:
              type: object
              required:
                - geo_uri
                - display_name
                - author_public_key
                - author_signature
                - challenge_response
              properties:
                geo_uri:
                  type: string
                description:
                  type: [string, "null"]
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: |
                    Display name written to the virtual user's Matrix
                    profile. Presentation data; deliberately not covered by
                    the author signature.
                author_public_key:
                  type: string
                author_signature:
                  type: string
                reply_to:
                  type: [string, "null"]
                  description: Reply parent event ID (m.in_reply_to). Part of the author signature JSON array as `reply_to` (null when absent).
                thread_root:
                  type: [string, "null"]
                  description: Thread root event ID (m.thread). Orthogonal to reply_to. Part of the author signature JSON array as `thread_root` (null when absent). Signature covers ["LOCATE", site, page, geo_uri, reply_to, thread_root, challenge_prefix].
                challenge_response:
                  type: string
                  description: PoW challenge response `prefix|nonce`; the signed `challenge_prefix` is the part before `|`.
      responses:
        "202":
          description: "Location submission accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/sites/{site_id}/pages/{page_slug}/upgrade:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageSlug"
    post:
      tags: [Governance]
      summary: Upgrade a comment room
      operationId: upgradePageRoom
      description: |
        Upgrades the site's active comment room for this page through the
        homeserver's native `/upgrade` and converges the replacement:
        metadata is repaired, the room is re-linked into the site Space,
        site roles are re-invited, and the old room is superseded. The
        target version must be newer than the room's current version; the
        upgrade is executed by the AS bot, which stays the replacement
        room's creator.
      security:
        - claimToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeRoomRequest"
      responses:
        "200":
          description: Replacement room converged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradePageRoomResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
