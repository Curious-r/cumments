openapi: 3.2.0
$self: https://cumments.curious.host/openapi.yaml
info:
  title: Cumments API
  version: 0.27.0
  license:
    name: MIT
    url: https://github.com/Curious-r/cumments/blob/main/LICENSE
  description: |
    Backend-only comment API backed by Matrix. Writes are asynchronous:
    POST/PATCH/DELETE accept a submission and return `202 { "submission_id" }`;
    the projected comment later carries the same `submission_id`.

    Comment reads use the RFC 10008 `QUERY` method, modeled natively by
    OpenAPI 3.2.
servers:
  - url: "{scheme}://{host}"
    description: Cumments API origin
    variables:
      scheme:
        default: https
        enum: [http, https]
      host:
        default: cumments.curious.host
        description: |
          API host and optional port. For local development use
          `localhost:7931`.
tags:
  - name: Comments
    description: Comment reads, writes, and live events
  - name: Sites
    description: Site registration and origin verification
  - name: Operator
    description: Operator-only management endpoints
  - name: Meta
    description: Infrastructure endpoints
security: []
paths:
  /health:
    get:
      tags: [Meta]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/Error"
  /api/v1/challenge:
    get:
      tags: [Comments]
      summary: Get a proof-of-work challenge
      operationId: getChallenge
      responses:
        "200":
          description: Challenge ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/sites/{site_id}/pages/{page_slug}/comments:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageSlug"
    post:
      tags: [Comments]
      summary: Submit a comment
      operationId: postComment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        description: Author signature covers ["POST", site, page, content|media.url, reply_to, thread_root, challenge_prefix] (reply_to/thread_root null when absent).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostCommentRequest"
      responses:
        "202":
          description: "Submission accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags: [Comments]
      summary: Edit a comment (body carries comment_id)
      operationId: updateCommentBody
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
      responses:
        "202":
          description: "Edit submission accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Comments]
      summary: Delete a comment (comment_id is a query parameter)
      operationId: deleteComment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CommentIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCommentRequest"
      responses:
        "202":
          description: "Delete submission accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
    query:
      operationId: queryComments
      summary: List comments (QUERY)
      description: |
        Sent as `QUERY /api/v1/sites/{site_id}/pages/{page_slug}/comments`
        with a JSON body.
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/PageSlug"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  default: 1
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
            examples:
              firstPage:
                summary: First page at the default page size
                value:
                  page: 1
                  per_page: 20
      responses:
        "200":
          description: Paginated comments
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              examples:
                activeComment:
                  summary: Active comment with unset optional metadata
                  value:
                    data:
                      - event_id: "$comment:hs"
                        site_id: my-blog
                        page_slug: hello
                        author:
                          type: visitor
                          display_name: Alice
                          avatar_url: null
                          public_key: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
                          mxid: null
                        content:
                          type: text
                          body: Hello
                          style: normal
                        timestamp: "2026-08-25T04:00:00Z"
                        edited_at: null
                        reply_to: null
                        thread_root: null
                        submission_id: null
                        status: active
                        redacted_at: null
                        redacted_by: null
                        reactions: []
                    meta:
                      total: 1
                      page: 1
                      per_page: 20
                      total_pages: 1
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/pages/{page_slug}/comments/{comment_id}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageSlug"
      - $ref: "#/components/parameters/CommentId"
    patch:
      tags: [Comments]
      summary: Edit a comment (path form)
      operationId: updateCommentPath
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
      responses:
        "202":
          description: "Edit submission accepted (replays carry Idempotent-Replayed: true)"
          headers:
            Idempotent-Replayed:
              description: "true when this is a replay of an accepted request"
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/sites/{site_id}/pages/{page_slug}/sse:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageSlug"
    get:
      tags: [Comments]
      summary: Live comment events (SSE)
      operationId: commentSse
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              itemSchema:
                $ref: "#/components/schemas/CommentSseFrame"
              examples:
                messageCreated:
                  summary: A new projected comment
                  serializedValue: |
                    event: message_created
                    data: {"type":"message_created","payload":{"site_id":"my-blog","page_slug":"hello","message":{"event_id":"$comment:hs"}}}
                ephemeralTyping:
                  summary: Initial or incremental typing state
                  serializedValue: |
                    event: ephemeral
                    data: {"type":"typing","room_id":"!room:hs","user_id":"@alice:hs","typing":true,"display_name":"Alice"}
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/sites:
    post:
      tags: [Sites]
      summary: Register a site
      operationId: registerSite
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterSiteRequest"
      responses:
        "201":
          description: Site registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterSiteResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/sites/{site_id}/retirement:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Sites]
      summary: Retire a site
      operationId: startSiteRetirement
      security:
        - claimToken: []
      responses:
        "202":
          description: Site retirement accepted; background retirement scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetirementResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    get:
      tags: [Sites]
      summary: Get site retirement status
      operationId: getSiteRetirement
      responses:
        "200":
          description: Site retirement status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetirementResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/sites/{site_id}/verifications:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Sites]
      summary: Start origin verification
      operationId: startVerification
      parameters:
        - $ref: "#/components/parameters/ClaimToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartVerificationRequest"
      responses:
        "200":
          description: Verification challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationChallengeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/sites/{site_id}/verifications/confirm:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Sites]
      summary: Confirm origin verification
      operationId: confirmVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmVerificationRequest"
      responses:
        "200":
          description: Origin verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmVerificationResponse"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/sites/{site_id}/secret:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Sites]
      summary: Issue or rotate an HMAC site secret
      operationId: issueSecret
      parameters:
        - $ref: "#/components/parameters/ClaimToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueSecretRequest"
      responses:
        "200":
          description: Secret issued once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueSecretResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/operator/sites:
    query:
      tags: [Operator]
      summary: List managed sites (QUERY)
      operationId: listOperatorSites
      description: |
        Sent as `QUERY /api/v1/operator/sites` with an optional JSON body
        carrying pagination and the `site_id` filter.
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorListQuery"
      responses:
        "200":
          description: Paginated sites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSitePage"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/operator/sites/{site_id}/retirement:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Operator]
      summary: Retire a site (operator)
      operationId: operatorStartSiteRetirement
      security:
        - operatorToken: []
      responses:
        "202":
          description: Site retirement accepted; background retirement scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetirementResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    get:
      tags: [Operator]
      summary: Get site retirement status (operator)
      operationId: operatorGetSiteRetirement
      security:
        - operatorToken: []
      responses:
        "200":
          description: Site retirement status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetirementResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/operator/sites/{site_id}/origins/revoke:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Operator]
      summary: Revoke a verified origin
      operationId: revokeVerifiedOrigin
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeOriginRequest"
      responses:
        "200":
          description: Site updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorSite"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/operator/sites/{site_id}/secret/rotate:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Operator]
      summary: Rotate HMAC secret
      operationId: rotateSecret
      security:
        - operatorToken: []
      responses:
        "200":
          description: New secret issued once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateSecretResponse"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/operator/sites/{site_id}/secret:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    delete:
      tags: [Operator]
      summary: Revoke HMAC secret
      operationId: revokeSecret
      security:
        - operatorToken: []
      responses:
        "200":
          description: Secret revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeSecretResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/operator/sites/{site_id}/config-snippet:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [Operator]
      summary: Export config snippet
      operationId: configSnippet
      security:
        - operatorToken: []
      responses:
        "200":
          description: TOML config snippet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSnippetResponse"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/operator/sites/{site_id}/claim-token/rotate:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      tags: [Operator]
      summary: Rotate claim token
      operationId: rotateClaimToken
      security:
        - operatorToken: []
      responses:
        "200":
          description: New claim token issued once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateClaimTokenResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/operator/quarantined-rooms:
    query:
      tags: [Operator]
      summary: List quarantined rooms (QUERY)
      operationId: listQuarantinedRooms
      description: |
        Sent as `QUERY /api/v1/operator/quarantined-rooms` with an optional JSON
        body carrying pagination and the `site_id` filter.
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorListQuery"
      responses:
        "200":
          description: Paginated quarantined rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorQuarantinedRoomPage"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/operator/quarantined-rooms/{room_id}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    delete:
      tags: [Operator]
      summary: Reinstate a room
      operationId: reinstateQuarantinedRoom
      security:
        - operatorToken: []
      responses:
        "204":
          description: Room reinstated (idempotent)
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/operator/room-upgrade-intents:
    query:
      tags: [Operator]
      summary: List native room upgrade intents (QUERY)
      operationId: listRoomUpgradeIntents
      description: |
        Sent as `QUERY /api/v1/operator/room-upgrade-intents` with optional
        pagination and status filter.
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeIntentListQuery"
      responses:
        "200":
          description: Paginated upgrade intents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorRoomUpgradeIntentPage"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/operator/room-upgrade-intents/{room_id}/recoveries:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [Operator]
      summary: Recover a reviewed room upgrade
      operationId: createRoomUpgradeRecovery
      description: |
        Completes a bot-initiated room upgrade whose homeserver commit survived
        a local failure. The exact version and replacement must match the
        durable intent; Matrix state is revalidated before adoption.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/RoomUpgradeRecoveryRequest"
      responses:
        "200":
          description: Replacement adopted and registry converged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomUpgradeRecoveryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/operator/projection-repairs:
    query:
      tags: [Operator]
      summary: List projection repairs
      operationId: listProjectionRepairs
      security:
        - operatorToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  default: 1
                per_page:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                status:
                  type: string
                  enum: [pending, manual, resolved]
      responses:
        "200":
          description: Paginated projection repairs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionRepairPage"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/operator/projection-repairs/{target_event_id}:
    parameters:
      - $ref: "#/components/parameters/TargetEventId"
    get:
      tags: [Operator]
      summary: Get a projection repair
      operationId: getProjectionRepair
      security:
        - operatorToken: []
      responses:
        "200":
          description: Projection repair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionRepair"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/operator/projection-repairs/{target_event_id}/retry:
    parameters:
      - $ref: "#/components/parameters/TargetEventId"
    post:
      tags: [Operator]
      summary: Retry a pending or manual projection repair
      operationId: retryProjectionRepair
      security:
        - operatorToken: []
      responses:
        "202":
          description: Projection repair requeued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectionRepair"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/operator/rooms/{room_id}/upgrade:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [Operator]
      summary: Upgrade a comment room (operator)
      operationId: operatorUpgradeRoom
      description: |
        Operator mirror of the site-level upgrade endpoint: upgrades a
        registered active comment room and converges the replacement. The
        target version must be newer than the room's current version; the
        upgrade is executed by the AS bot, which stays the replacement
        room's creator.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeRoomRequest"
      responses:
        "200":
          description: Replacement room converged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeRoomResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/operator/rooms/{room_id}/retirement:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    post:
      tags: [Operator]
      summary: Retire a comment room (operator)
      operationId: operatorStartRoomRetirement
      description: |
        Operator mirror of the site-level page retirement: marks the
        registered active room `Retired`, stopping new writes, and the
        background reconciler leaves the Matrix room (rename, alias removal,
        AS sender and virtual users) and clears local projections.
      security:
        - operatorToken: []
      responses:
        "202":
          description: Room retirement accepted; room marked retiring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetirementResponse"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    get:
      tags: [Operator]
      summary: Get comment-room retirement status (operator)
      operationId: operatorGetRoomRetirement
      security:
        - operatorToken: []
      responses:
        "200":
          description: Room retirement status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetirementResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/media/{server}/{media_id}:
    parameters:
      - name: server
        in: path
        required: true
        schema:
          type: string
      - name: media_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,255}$"
    get:
      tags: [Public]
      summary: Proxy a Matrix media file (signed URL)
      operationId: proxyMedia
      description: |
        Public read-only proxy for MXC media. URLs are HMAC-signed with a
        short TTL, and the signature covers `server/media_id` plus the
        optional thumbnail `width`/`height`/`method` so minted URLs cannot
        be resized into larger or arbitrary thumbnail requests. Requests are
        rate limited, restricted to the configured homeserver and filtered
        by size/content type. Media IDs must follow the Matrix whitelist.
        Responses use a canonical MIME type, sandbox CSP, and inline only for
        Matrix-safe MIME types. The homeserver is queried through the
        authenticated `/_matrix/client/v1/media` endpoints (MSC3916) with
        the AppService token.
      parameters:
        - name: expires
          in: query
          required: true
          schema:
            type: integer
        - name: sig
          in: query
          required: true
          schema:
            type: string
        - name: width
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 4096
        - name: height
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 4096
        - name: method
          in: query
          required: false
          schema:
            type: string
            enum: [crop, scale]
      responses:
        "200":
          description: Media bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/sites/{site_id}/pages/{page_slug}/room:
