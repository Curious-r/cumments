      - $ref: "#/components/parameters/PageSlug"
    post:
      tags: [Comments]
      summary: Upload visitor media (image/video/audio/file, voice)
      operationId: uploadMedia
      description: |
        Uploads raw bytes as the visitor's virtual user. Query parameters carry
