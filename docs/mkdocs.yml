site_name: Cumments
site_url: https://cumments.curious.host/
# The config lives inside `docs/`; MkDocs resolves these paths relative to
# this file, so the docs directory itself is `.` and the site stays at the
# repository root.
docs_dir: .
site_dir: ../site

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.top

extra:
  # Injected by docs.yml (the release version on tags, `main` for a
  # manual one-off publish). Empty for local builds and the build-only main
  # check, which keeps the announcement bar hidden there.
  version: !ENV [CUMMENTS_DOCS_VERSION, '']

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true

nav:
  - Getting started:
      - Home: index.md
      - Quick start: quick-start.md
  - Concepts:
      - Architecture: architecture.md
      - Data model: data-model.md
      - Site trust:
          - Overview: site-trust.md
          - Verification walkthrough: site-verification.md
      - Site governance: site-governance.md
  - Reference:
      - API:
          - Overview: api/index.md
          - Comments: api/comments.md
          - Sites: api/sites.md
          - Governance: api/governance.md
          - Operator: api/operator.md
          - Media: api/media.md
          - Visitors: api/visitors.md
      - Configuration: configuration.md
      - CLI: cli.md
      - Problem types: problems/index.md
  - Development:
      - Development: development.md
      - Demo frontend: demo.md
