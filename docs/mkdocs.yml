site_name: Cumments
site_url: https://curious-r.github.io/cumments/
# The config lives inside `docs/`; MkDocs resolves these paths relative to
# this file, so the docs directory itself is `.` and the site stays at the
# repository root.
docs_dir: .
site_dir: ../site

theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.top

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true

nav:
  - Getting started:
      - Home: index.md
      - Quick start: installation.md
  - Concepts:
      - Architecture: architecture.md
      - Data model: data-model.md
      - Site trust:
          - Overview: site-authentication.md
          - Verification walkthrough: site-verification.md
      - Site governance: site-governance.md
  - Reference:
      - API: api.md
      - Configuration: configuration.md
      - CLI: cli.md
      - Problem types: problems/index.md
  - Development:
      - Development: development.md
      - Demo frontend: demo.md
