site_name: Cumments
site_url: https://curious-r.github.io/cumments/
# The config lives inside `docs/`; MkDocs resolves these paths relative to
# this file, so the docs directory itself is `.` and the site stays at the
# repository root.
docs_dir: .
site_dir: ../site

theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.top

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API: api.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Demo: demo.md
  - CLI: cli.md
  - Development: development.md
  - Installation: installation.md
  - Site authentication: site-authentication.md
  - Site governance: site-governance.md
  - Site verification: site-verification.md
  - Problem types: problems/index.md
