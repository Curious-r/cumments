# Default Cumments configuration bundled with the container image.
#
# The container starts in logging mode (no Matrix side effects). For
# production AppService mode, override via environment variables, e.g.:
#
#   CUMMENTS__MATRIX__MODE=appservice
#   CUMMENTS__MATRIX__HOMESERVER__ADDRESS=https://matrix.example.com
#   CUMMENTS__MATRIX__HOMESERVER__DOMAIN=example.com
#   CUMMENTS__MATRIX__APPSERVICE__URL=https://cumments.example.com
#   CUMMENTS__MATRIX__APPSERVICE__AS_TOKEN=...
#   CUMMENTS__MATRIX__APPSERVICE__HS_TOKEN=...
#   CUMMENTS__MATRIX__MODERATION__OWNER_ID=@admin:example.com
#   CUMMENTS__SECURITY__POW_SECRET=...

[server]
host = "0.0.0.0"
port = 7931
cors_origins = "*"

[database]
url = "sqlite://data/cumments.db"

[security]
pow_secret = "change-me"
pow_difficulty = 4

[matrix]
mode = "logging"
