# Default Cumments configuration bundled with the container image.
#
# The container starts in logging mode (no Matrix side effects). For
# production AppService mode, override via environment variables, e.g.:
#
#   CUMMENTS__MATRIX__MODE=appservice
#   CUMMENTS__MATRIX__SERVER_NAME=your_server.tld
#   CUMMENTS__MATRIX__AS_TOKEN=...
#   CUMMENTS__MATRIX__HS_TOKEN=...
#   CUMMENTS__SECURITY__POW_SECRET=...

[server]
host = "0.0.0.0"
port = 7931
cors_origins = "*"

[database]
url = "sqlite://data/cumments.db"

[security]
pow_secret = "change-me"
pow_difficulty = 4

[matrix]
mode = "logging"
homeserver_url = "http://localhost:8008"
owner_id = "@admin:your_server.tld"
push_listen_port = 7931
