version: "3.8"

services:
  cumments:
    build:
      context: ../..
      dockerfile: misc/docker/Dockerfile
    ports:
      - "7931:7931"
    volumes:
      - cumments_data:/app/data
      # Mount configuration file (copy config-example.toml and customize)
      # - ./config.toml:/app/config.toml:ro
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7931/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  cumments_data:
