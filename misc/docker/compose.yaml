# Cumments AppService service, using the official published image.
#
# Add this block to the compose project that also defines the `tuwunel`
# service, or adjust the network/depends_on names for your homeserver.
# Paths are relative to this compose file; see docs/installation.md.
services:
  cumments:
    # Official image; `latest` tracks the newest version tag.
    image: ghcr.io/curious-r/cumments:latest
    # Temporary: build from repository main instead of the published image.
    # build:
    #   context: ../..
    #   dockerfile: misc/docker/Dockerfile
    env_file: cumments.env
    restart: unless-stopped
    volumes:
      # Read-only config directory (cumments.toml + registration.yaml).
      - ./cumments/config/:/etc/cumments/:ro
      # Writable SQLite data directory.
      - ./cumments/data/:/srv/cumments/:rw
    depends_on:
      - tuwunel
    networks:
      - tuwunel
