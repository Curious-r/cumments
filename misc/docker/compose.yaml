services:
  cumments:
    build:
      context: ../..
      dockerfile: misc/docker/Dockerfile
    ports:
      - "7931:7931"
    volumes:
      - cumments_data:/srv/cumments
      # Mount your configuration file over the default:
      # - ./cumments.toml:/etc/cumments/cumments.toml:ro
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7931/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  cumments_data:
