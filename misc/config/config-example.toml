# ==========================================
# Cumments Configuration Example
# ==========================================

[server]
# Host address to bind to (0.0.0.0 means accessible from any network interface)
host = "0.0.0.0"

# Port number for the HTTP server
port = 7931

# CORS origins allowed to access the API
# Comma-separated exact origins (e.g. "https://blog.example.com"),
# "*" for permissive, or empty to send no CORS headers.
cors_origins = "*"

[database]
# Database connection URL
# For SQLite: "sqlite://path/to/database.db"
# The file will be created automatically if it doesn't exist
url = "sqlite://data/cumments.db"

[security]
# Proof-of-Work secret for issuing anti-spam challenges
# Used to prevent automated spam comments
pow_secret = "${YOUR_POW_SECRET_HERE}"

# Proof-of-Work difficulty level (number of leading zeros required in hash)
# Higher values mean more computational work required to post comments
# Adjust based on your spam protection needs (typically 2-6)
pow_difficulty = 4

# ==========================================
# Matrix Integration (AppService Mode)
# ==========================================

[matrix]
mode = "appservice"

# Matrix homeserver URL (e.g., http://localhost:8008 for a local Synapse)
homeserver_url = "http://localhost:8008"

# The server name (domain) used to generate virtual user IDs
# e.g., "@_cumments_myblog_a1b2c3d4:your_server.tld"
server_name = "your_server.tld"

# The following tokens must match those in registration.yaml
# (generated by `cumments generate-registration`)
as_token = "${YOUR_AS_TOKEN_HERE}"
hs_token = "${YOUR_HS_TOKEN_HERE}"

# Localpart of the AppService sender user (used as room creator / admin)
sender_localpart = "cumments"

# Port for AppService to receive Matrix pushes
# Set to the same value as server.port to share the main HTTP listener
push_listen_port = 3001

# [Dyarchy feature] Your personal Matrix account ID
# Comment rooms invite this account and grant Admin (100) privileges,
# so comments can be moderated directly in a Matrix client.
owner_id = "@admin:your_server.tld"

# Local development without a homeserver: set mode = "logging" instead;
# then only homeserver_url and owner_id are required above.
