# ==========================================
# Cumments Configuration Example
# ==========================================
#
# Copy this file to `cumments.toml` (the default discovered name), or in the
# Docker image mount it at /etc/cumments/cumments.toml.
#
# This file is intentionally runnable as-is: it starts in `logging` mode,
# which needs no Matrix homeserver. The AppService production settings are
# shown commented out below.

[server]
# Host address to bind to (0.0.0.0 means accessible from any network interface)
host = "0.0.0.0"

# Port number for the HTTP server
port = 7931

# Reverse proxies trusted to set X-Forwarded-For. Rate limiting uses the peer
# IP unless it appears here. Entries are named presets (loopback / private /
# linklocal) or CIDR networks; bare IPs must use /32 or /128.
# trusted_proxies = ["loopback", "private", "10.42.0.0/16"]

[database]
# Database connection URL
# For the Docker image this is /srv/cumments/cumments.db (the mounted volume).
# For local development, change to "sqlite://data/cumments.db".
# The file will be created automatically if it doesn't exist
url = "sqlite:///srv/cumments/cumments.db"

[security]
# Proof-of-Work secret for issuing anti-spam challenges
# Required. Replace with a random 64-char hex string. This is a literal value:
# the config loader does not expand ${VAR}. Prefer the
# CUMMENTS__SECURITY__POW_SECRET environment variable in production.
pow_secret = "change-me"

# Proof-of-Work difficulty level (number of leading zeros required in hash)
# Higher values mean more computational work required to post comments
# Adjust based on your spam protection needs (typically 2-6)
pow_difficulty = 4

# Site verification policy: "disabled" (no checks, dev only; also accepts
# `Origin: null` from file:// demo pages),
# "optional" (unverified sites keep working, verified sites enforced),
# or "required" (unverified sites cannot receive comments).
site_verification = "optional"

# Operator token for the admin API (optional). Unset disables admin routes.
# Prefer the CUMMENTS__SECURITY__ADMIN_TOKEN environment variable.
# admin_token = "change-me"
# Matrix chat-channel instance operators (fully qualified MXIDs). Empty by
# default: the bot's platform-level commands are disabled.
# admin_mxids = ["@admin:your-matrix-domain"]

# Allow verification against loopback/private/link-local IP-literal origins.
# Keep false in production: verification confirm makes outbound HTTP/DNS
# probes. Enable only for tests or intentionally internal deployments.
# allow_private_verification_origins = false

# ── Operator-declared sites ─────────────────────────────────────
# Sites listed here are trusted without online verification. This is the
# declarative alternative to the self-service verification API.
#
# [sites."my-blog"]
# # "origin" (browser Origin, default) or "secret" (HMAC via edge function)
# auth_mode = "origin"
# # Exact origins or subdomain wildcards, trusted without proof.
# allowed_origins = ["https://blog.example.com", "https://*.blog.example.com"]
#
# [sites."strict-blog"]
# auth_mode = "secret"
# # The HMAC key (at least 32 chars). Prefer the environment variable:
# # CUMMENTS__SITES__strict-blog__SECRET=...
# secret = "change-me"
# ==========================================
# Matrix Integration
# ==========================================

[matrix]
# "appservice" (production) or "logging" (local debugging, no Matrix side effects)
mode = "logging"

# ── Production AppService mode ──────────────────────────────────
# To connect to a homeserver, switch to appservice and uncomment the
# sections below, then fill in real values:
#
# [matrix.homeserver]
# # Base URL of the homeserver CS API, as seen by Cumments.
# address = "https://matrix.example.com"
# # Matrix ID domain: the part after ':' in user IDs and room aliases.
# domain = "example.com"
#
# [matrix.appservice]
# # Must match the `id` in registration.yaml.
# id = "cumments"
# # URL the homeserver uses to deliver push transactions to this instance.
# # Must be reachable from the homeserver; it is not matrix.homeserver.address.
# url = "https://cumments.example.com"
# listen_host = "0.0.0.0"
# listen_port = 3001
# sender_localpart = "_cumments_bot"
# # Tokens must match registration.yaml; prefer environment variables:
# as_token = "<as_token from registration.yaml>"
# hs_token = "<hs_token from registration.yaml>"
# # Optional: verify at startup that this config matches registration.yaml.
# registration_file = "registration.yaml"

# ── Rate limits (optional; defaults shown) ─────────────────────
# Each bucket limits requests per client key over a fixed window and is
# applied at startup. `window` accepts human durations like "30s" / "1h".
#
# [rate_limit]
# registration = { requests = 10,  window = "1h" }
# verification  = { requests = 20,  window = "1h" }
# confirm       = { requests = 30,  window = "1h" }
# admin         = { requests = 60,  window = "1m" }
# write         = { requests = 120, window = "1h" }
# sse           = { requests = 20,  window = "1h" }
# media         = { requests = 120, window = "1h" }
# moderation    = { requests = 60,  window = "1h" }
