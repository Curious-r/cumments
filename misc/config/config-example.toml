# ==========================================
# Cumments Configuration Example
# ==========================================

[server]
# Host address to bind to (0.0.0.0 means accessible from any network interface)
host = "0.0.0.0"

# Port number for the HTTP server
port = 7931

# CORS origins allowed to access the API
# Comma-separated exact origins (e.g. "https://blog.example.com"),
# "*" for permissive, or empty to send no CORS headers.
cors_origins = "*"

[database]
# Database connection URL
# For SQLite: "sqlite://path/to/database.db"
# The file will be created automatically if it doesn't exist
url = "sqlite://data/cumments.db"

[security]
# Proof-of-Work secret for issuing anti-spam challenges
# Required. Replace with a random 64-char hex string. This is a literal value:
# the config loader does not expand ${VAR}. Prefer the
# CUMMENTS__SECURITY__POW_SECRET environment variable in production.
pow_secret = "change-me"

# Proof-of-Work difficulty level (number of leading zeros required in hash)
# Higher values mean more computational work required to post comments
# Adjust based on your spam protection needs (typically 2-6)
pow_difficulty = 4

# ==========================================
# Matrix Integration
# ==========================================

[matrix]
# "appservice" (production) or "logging" (local debugging, no Matrix side effects)
mode = "appservice"

# ── Homeserver / Matrix identity domain ──────────────────────────
[matrix.homeserver]
# Base URL of the homeserver CS API, as seen by Cumments.
# This is the API endpoint, not necessarily the user-facing server name.
address = "https://matrix.example.com"

# Matrix ID domain: the part after ':' in user IDs and room aliases.
# Usually the well-known delegated name (e.g. "example.com" even when the
# CS API lives at "matrix.example.com"). This is independent of `address`.
domain = "example.com"

# ── AppService registration / push receiver ──────────────────────
[matrix.appservice]
# Must match the `id` in registration.yaml.
id = "cumments"

# URL the homeserver uses to deliver push transactions to this Cumments
# instance. This must be reachable FROM the homeserver; it is not the same
# as matrix.homeserver.address.
url = "https://cumments.example.com"

# Local bind address/port for the push receiver.
# Set listen_port equal to server.port to share the main HTTP listener.
listen_host = "0.0.0.0"
listen_port = 3001

# Localpart of the AppService sender user. Must match registration.yaml and
# start with `_cumments_` so it falls inside the users namespace.
sender_localpart = "_cumments_bot"

# Tokens must match registration.yaml. Prefer environment variables:
#   CUMMENTS__MATRIX__APPSERVICE__AS_TOKEN=...
#   CUMMENTS__MATRIX__APPSERVICE__HS_TOKEN=...
# as_token = "<as_token from registration.yaml>"
# hs_token = "<hs_token from registration.yaml>"

# Optional: path to registration.yaml. When set, startup verifies that
# id/url/tokens/sender_localpart/namespaces match this configuration.
# registration_file = "registration.yaml"

# ── Moderation ───────────────────────────────────────────────────
[matrix.moderation]
# Your personal Matrix account ID. Comment rooms invite this account and
# grant Admin (100) privileges, so comments can be moderated directly in a
# Matrix client.
owner_id = "@admin:example.com"

# For local development without a homeserver, set mode = "logging" instead.
# In that case no matrix.homeserver / matrix.appservice / matrix.moderation
# sections are needed:
#
# [matrix]
# mode = "logging"
