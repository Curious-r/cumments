# Builds and publishes the Cumments Docker image.
#
# Validation builds run only when Docker-relevant files change (the
# Dockerfile/config, dependency manifests, or this workflow); code-only
# changes are covered by ci.yml. Version tags always build and publish;
# manual runs can opt into publishing with the `publish` input.
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'misc/docker/**'
      - 'misc/config/**'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'crates/**/build.rs'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'misc/docker/**'
      - 'misc/config/**'
      - '.dockerignore'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'crates/**/build.rs'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Push the built image to GHCR
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Check toolchain sync
        run: bash misc/docker/check-toolchain-sync.sh

      - name: Resolve Rust version from rust-toolchain.toml
        id: rust-version
        run: echo "version=$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: misc/docker/Dockerfile
          build-args: RUST_VERSION=${{ steps.rust-version.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build provenance attestation
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
