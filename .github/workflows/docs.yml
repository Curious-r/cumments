name: Docs

# Publishes the documentation site on `v*` release tags only. Pushes to main
# run the build-only check in ci.yml, so unreleased main never appears on the
# public site. `workflow_dispatch` is the manual escape hatch for a
# one-off publish.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Resolve docs version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=v${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Install docs dependencies
        run: npm ci --ignore-scripts

      - name: Build docs site
        env:
          CUMMENTS_DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: npm run docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Intentionally no `environment:` here. The `github-pages` environment's
    # branch policy only allows `main`, and GitHub deployment branch policies
    # cannot list tag refs. A `v*` tag is itself the publish gate, so the
    # environment protection is redundant for this workflow.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
