name: Docs

# Build-only documentation check for main and pull requests. The public site
# is published from `v*` release tags by docs-deploy.yml, so the online docs
# always match the latest released binary instead of unreleased main.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs site
        run: |
          pip install --quiet mkdocs==1.6.1 mkdocs-material==9.7.7
          mkdocs build --strict --config-file docs/mkdocs.yml
