name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev cmake clang

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (warnings as errors)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev cmake clang

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - name: Check locked workspace
        run: cargo check --locked --all-targets --all-features

      - name: Unit and integration tests
        run: cargo test --locked --all-targets --all-features

      - name: Doc tests
        run: cargo test --locked --doc --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        # RUSTSEC-2026-0235 (rkyv 0.7.46): rkyv is an *unactivated* optional
        # dependency of rust_decimal, pulled into Cargo.lock by sea-orm's
        # default `with-rust_decimal` feature. It is never compiled (cargo tree
        # shows no path to it), and rust_decimal has no release using rkyv 0.8
        # yet. Revisit this ignore when rust_decimal or sea-orm updates.
        run: cargo audit --ignore RUSTSEC-2026-0235

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check inline scripts
        run: |
          set -euo pipefail
          awk '/<script type="module">/{flag=1; next} /<\/script>/{flag=0} flag' \
            misc/frontend/index.html > /tmp/cumments-module.mjs
          awk '/<script>/{flag=1; next} /<\/script>/{flag=0} flag' \
            misc/frontend/index.html > /tmp/cumments-main.js
          node --check /tmp/cumments-module.mjs
          node --check /tmp/cumments-main.js
