name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      audit: ${{ steps.filter.outputs.audit }}
      toolchain: ${{ steps.filter.outputs.toolchain }}
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      docs: ${{ steps.filter.outputs.docs }}
      workflow: ${{ steps.filter.outputs.workflow }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
            audit:
              - 'Cargo.toml'
              - 'Cargo.lock'
            toolchain:
              - 'rust-toolchain.toml'
              - 'misc/docker/Dockerfile'
              - 'misc/docker/check-toolchain-sync.sh'
            frontend:
              - 'misc/demo/**'
            openapi:
              - 'docs/openapi.yaml'
            docs:
              - 'docs/**'
            workflow:
              - '.github/workflows/ci.yml'

  fmt:
    name: Format
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.toolchain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Check toolchain sync
        run: bash misc/docker/check-toolchain-sync.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev cmake clang

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (warnings as errors)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsqlite3-dev cmake clang

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Check locked workspace
        run: cargo check --locked --all-targets --all-features

      - name: Unit and integration tests
        run: cargo test --locked --all-targets --all-features

      - name: Doc tests
        run: cargo test --locked --doc --all-features

  audit:
    name: Security audit
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        # RUSTSEC-2026-0235 (rkyv 0.7.46): rkyv is an *unactivated* optional
        # dependency of rust_decimal, pulled into Cargo.lock by sea-orm's
        # default `with-rust_decimal` feature. It is never compiled (cargo tree
        # shows no path to it), and rust_decimal has no release using rkyv 0.8
        # yet. Revisit this ignore when rust_decimal or sea-orm updates.
        run: cargo audit --ignore RUSTSEC-2026-0235

  frontend:
    name: Frontend syntax
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check demo script
        run: node --check misc/demo/demo.js

  openapi:
    name: OpenAPI
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml

  docs:
    name: Docs
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build docs site
        run: |
          pip install --quiet mkdocs==1.6.1 mkdocs-material==9.7.7
          mkdocs build --strict --config-file docs/mkdocs.yml
