[workspace]
resolver = "2"
members = ["crates/cumments-core", "crates/cumments-storage", "crates/cumments-api", "crates/cumments", "crates/cumments-reconciler", "crates/cumments-operator", "crates/cumments-projection"]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.101"
thiserror = "2.0.18"
anyhow = "1.0.100"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
dotenvy = "0.15.7"
config = { version = "0.15.19", features = ["toml"] }
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.57", features = ["derive"] }

rand = "0.9.2"
sha2 = "0.10.9"
hex = "0.4.3"
base64 = "0.22.1"
hmac = "0.12.1"

tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
futures = "0.3.31"
async-trait = "0.1.89"

sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }

axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
reqwest = { version = "0.13.1", features = ["stream", "rustls-tls"] }

matrix-sdk = { version = "0.14.0", default-features = false, features = ["rustls-tls", "markdown"] }
