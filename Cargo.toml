[workspace]
resolver = "2"
members = ["crates/cumments-core", "crates/cumments-store", "crates/cumments-api", "crates/cumments", "crates/cumments-reconciler", "crates/cumments-matrix", "crates/cumments-projector"]

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Internal crates
cumments-core = { path = "crates/cumments-core" }
cumments-store = { path = "crates/cumments-store" }
cumments-api = { path = "crates/cumments-api" }
cumments-reconciler = { path = "crates/cumments-reconciler" }
cumments-matrix = { path = "crates/cumments-matrix" }
cumments-projector = { path = "crates/cumments-projector" }

# External dependencies
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = "0.8.8"
base64 = "0.22.1"
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.57", features = ["derive"] }
config = { version = "0.15.19", features = ["toml"] }
dotenvy = "0.15.7"
futures = "0.3.31"
hex = "0.4.3"
hmac = "0.12.1"
lazy_static = "1.5.0"
regex = "1.11.1"
rand = "0.9.2"
reqwest = { version = "0.13.1", features = ["json", "query", "stream", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.101"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "2.0.18"
validator = { version = "0.20", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
sea-orm = { version = "2.0.0", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "2.0.0", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
