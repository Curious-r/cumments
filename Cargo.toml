[workspace]
resolver = "2"
members = [ "crates/domain", "crates/storage", "crates/adapter", "crates/server" ]

[workspace.package]
version = "0.11.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
config = { version = "0.13", features = ["toml"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }

rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
hmac = "0.12"

tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }

axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.11", features = ["stream", "rustls-tls"] }

matrix-sdk = { version = "0.7", default-features = false, features = ["rustls-tls", "markdown"] }

domain = { path = "crates/domain" }
storage = { path = "crates/storage" }
adapter = { path = "crates/adapter" }
